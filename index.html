<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pousada Vale Verde — Reservas</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
    padding: 24px 16px;
  }
  h1 {
    font-size: 1.4rem;
    margin-bottom: 24px;
    color: #2d5a27;
  }
  .card {
    background: #fff;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 24px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.1);
  }
  .card h2 {
    font-size: 1rem;
    margin-bottom: 16px;
    color: #444;
  }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 0.82rem; font-weight: bold; color: #555; }
  input, select {
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 0.95rem;
    width: 100%;
  }
  input:focus, select:focus {
    outline: none;
    border-color: #2d5a27;
  }
  button.btn-salvar {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    background: #2d5a27;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
  }
  button.btn-salvar:hover { background: #3a7a32; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  th {
    text-align: left;
    padding: 8px 10px;
    background: #f0f0f0;
    border-bottom: 2px solid #ddd;
    font-size: 0.8rem;
    color: #555;
    text-transform: uppercase;
  }
  td {
    padding: 10px;
    border-bottom: 1px solid #eee;
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .btn-excluir {
    background: none;
    border: 1px solid #e55;
    color: #e55;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.8rem;
  }
  .btn-excluir:hover { background: #fee; }
  .vazio {
    text-align: center;
    padding: 30px;
    color: #aaa;
    font-size: 0.9rem;
  }
  @media (max-width: 500px) {
    .form-grid { grid-template-columns: 1fr; }
    .form-group.full { grid-column: 1; }
    table { font-size: 0.78rem; }
    td, th { padding: 7px 6px; }
  }
</style>
</head>
<body>

<h1>🌿 Pousada Vale Verde — Controle de Reservas</h1>

<!-- FORMULÁRIO -->
<div class="card">
  <h2>Nova Reserva</h2>
  <div class="form-grid">
    <div class="form-group full">
      <label for="nome">Nome do Hóspede</label>
      <input id="nome" type="text" placeholder="Nome completo">
    </div>
    <div class="form-group">
      <label for="telefone">Telefone</label>
      <input id="telefone" type="tel" placeholder="(00) 00000-0000">
    </div>
    <div class="form-group">
      <label for="chale">Chalé</label>
      <select id="chale">
        <option value="">Selecione...</option>
        <option value="Chalé 1">Chalé 1</option>
        <option value="Chalé 2">Chalé 2</option>
        <option value="Chalé 3">Chalé 3</option>
        <option value="Chalé 4">Chalé 4</option>
      </select>
    </div>
    <div class="form-group">
      <label for="dias">Dias de Estadia</label>
      <input id="dias" type="number" min="1" placeholder="Ex: 3">
    </div>
    <div class="form-group">
      <label for="valor">Valor Total (R$)</label>
      <input id="valor" type="number" min="0" step="0.01" placeholder="Ex: 450.00">
    </div>
  </div>
  <button class="btn-salvar" onclick="salvarReserva()">Salvar Reserva</button>
</div>

<!-- LISTA -->
<div class="card">
  <h2>Reservas Cadastradas</h2>
  <table>
    <thead>
      <tr>
        <th>Nome</th>
        <th>Telefone</th>
        <th>Chalé</th>
        <th>Dias</th>
        <th>Valor</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tabelaReservas"></tbody>
  </table>
</div>

<script>
  function carregar() {
    try { return JSON.parse(localStorage.getItem('reservas') || '[]'); }
    catch { return []; }
  }
  function salvar(lista) {
    try { localStorage.setItem('reservas', JSON.stringify(lista)); } catch {}
  }

  function renderizar() {
    const lista = carregar();
    const tbody = document.getElementById('tabelaReservas');
    if (lista.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="vazio">Nenhuma reserva cadastrada.</td></tr>';
      return;
    }
    tbody.innerHTML = lista.map((r, i) => `
      <tr>
        <td>${r.nome}</td>
        <td>${r.telefone}</td>
        <td>${r.chale}</td>
        <td>${r.dias} dia${r.dias > 1 ? 's' : ''}</td>
        <td>R$ ${Number(r.valor).toFixed(2).replace('.', ',')}</td>
        <td><button class="btn-excluir" onclick="excluir(${i})">Excluir</button></td>
      </tr>
    `).join('');
  }

  function salvarReserva() {
    const nome = document.getElementById('nome').value.trim();
    const telefone = document.getElementById('telefone').value.trim();
    const chale = document.getElementById('chale').value;
    const dias = parseInt(document.getElementById('dias').value);
    const valor = parseFloat(document.getElementById('valor').value);

    if (!nome || !telefone || !chale || !dias || !valor) {
      alert('Preencha todos os campos.');
      return;
    }

    const lista = carregar();
    lista.push({ nome, telefone, chale, dias, valor });
    salvar(lista);
    renderizar();

    document.getElementById('nome').value = '';
    document.getElementById('telefone').value = '';
    document.getElementById('chale').value = '';
    document.getElementById('dias').value = '';
    document.getElementById('valor').value = '';
  }

  function excluir(i) {
    if (!confirm('Excluir esta reserva?')) return;
    const lista = carregar();
    lista.splice(i, 1);
    salvar(lista);
    renderizar();
  }

  renderizar();
</script>
</body>
</html>
